    notes: Tracking false, domains empty.

  - id: AR-PM-collected-data-types
    title: NSPrivacyCollectedDataTypes describes every data type the app collects
    area: privacy_manifest
    source: https://developer.apple.com/documentation/bundleresources/privacy-manifest-files
    checked: 2026-11-02
    applies_when: data_leaves_device
    milestone: 3
    check: review
    test: checklist:.claude/agents/app-store-reviewer.md
    status_now: not_applicable_yet
    requirement: >
      The manifest records "The types of data collected by your app or third-party SDK. You need to
      provide this information for your app or third-party SDK on all platforms."
    notes: >
      Empty today, which is true (nothing reaches us). Milestone 3 sync must add the collected types
      (D-031).

  - id: AR-RR-declared-reasons
    title: Each required-reason API category used has an approved reason in the manifest
    area: required_reason_api
    source: https://developer.apple.com/documentation/bundleresources/describing-use-of-required-reason-api
    checked: 2026-11-02
    applies_when: always
    check: static
    test: todo:02-static-compliance-checks
    status_now: met
    requirement: >
      "Starting May 1, 2024, apps that don't describe their use of required reason API in their privacy
      manifest file aren't accepted by App Store Connect." Categories (NSPrivacyAccessedAPIType page):
      NSPrivacyAccessedAPICategoryFileTimestamp, NSPrivacyAccessedAPICategorySystemBootTime,
      NSPrivacyAccessedAPICategoryDiskSpace, NSPrivacyAccessedAPICategoryActiveKeyboards,
      NSPrivacyAccessedAPICategoryUserDefaults. Declared reasons must match the app's real use, and the
      APIs may not be used for tracking or fingerprinting.
    notes: >
      grep of WantWise/, WantWiseShare/, Shared/ and WantWiseCore/Sources for UserDefaults, @AppStorage,
      file-date attributes, stat, disk-capacity, systemUptime, mach_absolute_time and activeInputModes
      found none (2026-11-02), so NSPrivacyAccessedAPITypes is correctly empty. The exact API list per
      category is on
