    checked: 2026-11-02
    applies_when: release
    check: person
    test: checklist:docs/APPLE_HANDOFF.md#app-store-connect-record
    status_now: not_applicable_yet
    requirement: >
      2.3.6: "Answer the age rating questions in App Store Connect honestly so that your app aligns
      properly with parental controls."

  - id: AR-GL-2.3.7-app-name
    title: Unique app name of at most 30 characters, keywords not stuffed
    area: accurate_metadata
    source: https://developer.apple.com/app-store/review/guidelines/#2.3.7
    checked: 2026-11-02
    applies_when: release
    check: person
    test: checklist:docs/APPLE_HANDOFF.md#app-store-connect-record
    status_now: not_applicable_yet
    requirement: >
      2.3.7: "Choose a unique app name ... App names must be limited to 30 characters."
    notes: The intended name "WantWise" is 8 characters; uniqueness is only known in App Store Connect.

  - id: AR-GL-2.3.8-metadata-all-audiences
    title: Metadata suits a 4+ rating, and "For Kids" / "For Children" are reserved for the Kids Category
    area: accurate_metadata
    source: https://developer.apple.com/app-store/review/guidelines/#2.3.8
    checked: 2026-11-02
    applies_when: release
    check: person
    test: checklist:docs/APPLE_HANDOFF.md#testflight-and-testers
    status_now: not_applicable_yet
    requirement: >
      2.3.8: metadata should "adhere to a 4+ age rating"; "Use of terms like 'For Kids' and 'For
      Children' in app metadata is reserved in the App Store for the Kids Category."
    notes: >
      The suggested Beta App Description in APPLE_HANDOFF.md ("Private family app for a child to think
      before buying things") doesn't use the reserved phrases; keep it that way.

  - id: AR-GL-2.5.1-public-apis
    title: Only public APIs; runs on the currently shipping OS
    area: app_completeness
    source: https://developer.apple.com/app-store/review/guidelines/#2.5.1
    checked: 2026-11-02
    applies_when: always
    check: static
    test: todo:02-static-compliance-checks
    status_now: met
    requirement: >
      2.5.1: "Apps may only use public APIs and must run on the currently shipping OS."
    notes: >
      grep for NSSelectorFromString, dlopen, dlsym and string-selector perform found none in the source
      folders (2026-11-02).

  - id: AR-GL-2.5.4-background-modes
    title: Background services only for their intended purpose
    area: app_completeness
    source: https://developer.apple.com/app-store/review/guidelines/#2.5.4
    checked: 2026-11-02
    applies_when: always
    check: static
    test: todo:02-static-compliance-checks
    status_now: met
    requirement: >
      2.5.4: "Multitasking apps may only use background services for their intended purposes: VoIP,
      audio playback, location, task completion, local notifications, etc."
    notes: No UIBackgroundModes key in either Info.plist (2026-11-02); reminders are local notifications (D-016).

  # ---------------------------------------------------------------- App Review Guidelines: 4.x

  - id: AR-GL-4.5.4-notifications
    title: Notifications are not required to use the app and carry no marketing or sensitive content
    area: purpose_strings
    source: https://developer.apple.com/app-store/review/guidelines/#4.5.4
    checked: 2026-11-02
    applies_when: notifications
    check: review
    test: checklist:.claude/agents/app-store-reviewer.md
    status_now: met
    requirement: >
      4.5.4: "Push Notifications must not be required for the app to function, and should not be used
      to send sensitive personal or confidential information. Push Notifications should not be used
      for promotions or direct marketing purposes unless customers have explicitly opted in".
    notes: >
      The guideline names push notifications; WantWise sends local reminders only (D-016). Reminder
      content is the child's own Want, not marketing. Whether the app works with notifications denied
      is checked by AR-GL-5.1.2-no-required-system-features.

  - id: AR-GL-4.8-login-services
    title: Third-party or social login for the primary account needs an equivalent privacy-preserving login option
    area: login_services
    source: https://developer.apple.com/app-store/review/guidelines/#4.8
    checked: 2026-11-02
    applies_when: third_party_login
    milestone: 3
    check: review
    test: checklist:.claude/agents/app-store-reviewer.md
    status_now: not_applicable_yet
    requirement: >
      4.8: apps that use a third-party or social login service "to set up or authenticate the user's
      primary account with the app must also offer as an equivalent option another login service"
      that limits data collection to name and email, lets users keep their email private, and doesn't
      collect interactions for advertising without consent. Exempt: apps that "exclusively use your
      company's own account setup and sign-in systems", and some education/enterprise cases.
    notes: >
      Milestone 3 parent sign-in (D-017). If it uses only our own (Supabase email) accounts, 4.8 doesn't
      apply; if it adds Google or similar, offer Sign in with Apple or an equivalent. The Sign in with
      Apple overview page (developer.apple.com/sign-in-with-apple/) returned no readable body on
      2026-11-02, so its details are not recorded here.

  # ---------------------------------------------------------------- App Review Guidelines: 5.1.1

  - id: AR-GL-5.1.1i-privacy-policy
    title: A privacy policy link in App Store Connect and inside the app
    area: data_collection
    source: https://developer.apple.com/app-store/review/guidelines/#data-collection-and-storage
    checked: 2026-11-02
    applies_when: release
    check: person
    test: checklist:docs/APP_STORE_COMPLIANCE.md#every-build-testflight
    status_now: not_met
    requirement: >
      5.1.1(i): "All apps must include a link to their privacy policy in the App Store Connect metadata
      field and within the app in an easily accessible manner." The policy says what is collected, how,
      all uses, retention and deletion, and how to revoke consent or request deletion.
    notes: >
      WantWise has no privacy policy and no in-app link. docs/APP_STORE_COMPLIANCE.md listed a policy as
      a Milestone 3 item; the guideline says "all apps". Whether Beta App Review enforces this for a
      TestFlight-only build is not stated on the fetched pages. A short on-device-only policy and an
      in-app link would close it; that is a product change, not made in this slice.

  - id: AR-GL-5.1.1ii-consent
    title: Collecting user or usage data needs consent and an easy way to withdraw it
    area: data_collection
    source: https://developer.apple.com/app-store/review/guidelines/#data-collection-and-storage
    checked: 2026-11-02
    applies_when: data_leaves_device
    milestone: 3
    check: review
    test: checklist:.claude/agents/app-store-reviewer.md
    status_now: not_applicable_yet
    requirement: >
      5.1.1(ii): "Apps that collect user or usage data must secure user consent for the collection ...
      Apps must also provide the customer with an easily accessible and understandable way to withdraw
      consent."

  - id: AR-GL-5.1.1iii-data-minimization
    title: Request only data relevant to core features; prefer the out-of-process picker to full Photos access
    area: data_collection
    source: https://developer.apple.com/app-store/review/guidelines/#data-collection-and-storage
    checked: 2026-11-02
    applies_when: photos
    check: static
    test: todo:02-static-compliance-checks
    status_now: met
    requirement: >
      5.1.1(iii): "Where possible, use the out-of-process picker or a share sheet rather than requesting
      full access to protected resources like Photos or Contacts."
    notes: >
      AddWantView uses PhotosPicker and the app receives images through its Share Extension; no
      PHPhotoLibrary authorization or PHAsset fetch in the source (grep, 2026-11-02).

  - id: AR-GL-5.1.1iv-respect-permissions
    title: Don't trick or force consent; offer alternatives when permission is declined
    area: data_collection
    source: https://developer.apple.com/app-store/review/guidelines/#data-collection-and-storage
    checked: 2026-11-02
    applies_when: always
    check: simulator
    test: todo:03-simulator-compliance-checks
    status_now: unknown
    requirement: >
      5.1.1(iv): "Apps must respect the user's permission settings and not attempt to manipulate, trick,
      or force people to consent to unnecessary data access ... Where possible, provide alternative
      solutions for users who don't grant consent."
    notes: >
      By design the camera button is optional (Photos and Share remain) and reminders are optional, but
      the app with each permission denied has not been run and observed yet. Slice 03.

  - id: AR-GL-5.1.1v-no-login-required
    title: Without significant account-based features, the app works without a login
    area: data_collection
    source: https://developer.apple.com/app-store/review/guidelines/#data-collection-and-storage
    checked: 2026-11-02
    applies_when: always
    check: review
    test: checklist:.claude/agents/app-store-reviewer.md
    status_now: met
    requirement: >
      5.1.1(v): "If your app doesn't include significant account-based features, let people use it
      without a login."
    notes: Milestones 1-2 have no login. Re-check when Milestone 3 sign-in lands (D-017).

  - id: AR-GL-5.1.1v-account-deletion
    title: An app that supports account creation offers account deletion inside the app
    area: data_collection
    source: https://developer.apple.com/app-store/review/guidelines/#data-collection-and-storage
    checked: 2026-11-02
    applies_when: account_signin
    milestone: 3
    check: review
    test: checklist:.claude/agents/app-store-reviewer.md
    status_now: not_applicable_yet
    requirement: >
      5.1.1(v): "If your app supports account creation, you must also offer account deletion within the
      app."
    notes: >
      Milestone 3: the parent's account (D-017). If accounts are created only on the web or the
      Display, the support page (AR-ACCT-deletion-scope) still requires deletion to be startable in the
      app.

  - id: AR-ACCT-deletion-scope
    title: In-app account deletion removes the whole account and its personal data, not just deactivation
    area: data_collection
    source: https://developer.apple.com/support/offering-account-deletion-in-your-app/
    checked: 2026-11-02
    applies_when: account_signin
    milestone: 3
    check: review
    test: checklist:.claude/agents/app-store-reviewer.md
    status_now: not_applicable_yet
    requirement: >
      Deletion must be easy to find (typically account settings); "Offer to delete the entire account
      record, along with associated personal data", including shared user-generated content such as
      photos; "only offering to temporarily deactivate or disable an account is insufficient"; a direct
      link to a web page that completes deletion is allowed; apps outside highly regulated industries
      "should not require people to make a phone call, send an email"; apps that support Sign in with
      Apple "should use the Sign in with Apple REST API to revoke user tokens".
    notes: >
      For WantWise this means the family's Wants, decisions and photos in Supabase are deleted with the
      parent's account (Milestone 3).

  # ---------------------------------------------------------------- App Review Guidelines: 5.1.2

  - id: AR-GL-5.1.2-sharing-permission
    title: No use, transmission or sharing of personal data without permission; disclose third parties
    area: data_sharing
    source: https://developer.apple.com/app-store/review/guidelines/#data-use-and-sharing
    checked: 2026-11-02
    applies_when: data_leaves_device
    milestone: 3
    check: review
    test: checklist:.claude/agents/app-store-reviewer.md
    status_now: not_applicable_yet
    requirement: >
      5.1.2(i): "you may not use, transmit, or share someone's personal data without first obtaining
      their permission ... You must clearly disclose where personal data will be shared with third
      parties, including with third-party AI, and obtain explicit permission before doing so".
    notes: Supabase (Milestone 3) is a third party that would hold the family's data.

  - id: AR-GL-5.1.2-no-required-system-features
    title: The app doesn't require enabling notifications, location or tracking to use it
    area: data_sharing
    source: https://developer.apple.com/app-store/review/guidelines/#data-use-and-sharing
    checked: 2026-11-02
    applies_when: notifications
    check: simulator
    test: todo:03-simulator-compliance-checks
    status_now: unknown
    requirement: >
      5.1.2(i): "Your app may not require users to enable system functionalities (such as push
      notifications, location services, tracking) in order to access functionality, content, use the
      app".
    notes: >
      Intended to be met (reminders are optional; D-029), but the app has not been run with
      notifications denied. Slice 03.

  - id: AR-PRIV-no-tracking
    title: No tracking; ATT permission would be needed before any tracking
    area: data_sharing
    source: https://developer.apple.com/app-store/user-privacy-and-data-use/
    checked: 2026-11-02
    applies_when: always
    check: static
    test: todo:02-static-compliance-checks
    status_now: met
    requirement: >
      Tracking is "linking user or device data collected from your app with user or device data
      collected from other companies' apps, websites, or offline properties for targeted advertising or
      advertising measurement purposes" or sharing with data brokers; it needs App Tracking Transparency
      permission and an NSUserTrackingUsageDescription purpose string.
    notes: >
      Manifest declares NSPrivacyTracking false with no tracking domains; no AppTrackingTransparency
      import or advertising identifier in the source (2026-11-02).

  # ---------------------------------------------------------------- Privacy manifest

  - id: AR-PM-present-in-each-bundle
    title: PrivacyInfo.xcprivacy is in the app bundle and in the Share Extension bundle
    area: privacy_manifest
    source: https://developer.apple.com/documentation/bundleresources/adding-a-privacy-manifest-to-your-app-or-third-party-sdk
    checked: 2026-11-02
    applies_when: always
    check: static
    test: todo:02-static-compliance-checks
    status_now: met
    requirement: >
      iOS apps place the manifest "at the root of your app's bundle"; the file name must be
      PrivacyInfo.xcprivacy and it must be added to the target's resources. From the required-reason
      page: "For each executable or dynamic library in an app that uses a required reason API, the
      bundle that includes the executable or dynamic library needs to include a privacy manifest file
      that reports the API."
    notes: >
      project.yml lists Config/PrivacyInfo.xcprivacy as a resource of both targets (lines 49, 74);
      confirmed in both built bundles with Xcode 26.3 (docs/VERIFICATION.md, D-031).

  - id: AR-PM-valid-keys
    title: Every privacy manifest in the app is valid and has only expected keys and values
    area: privacy_manifest
    source: https://developer.apple.com/documentation/bundleresources/adding-a-privacy-manifest-to-your-app-or-third-party-sdk
    checked: 2026-11-02
    applies_when: always
    check: static
    test: todo:02-static-compliance-checks
    status_now: met
    requirement: >
      "All privacy manifest files in your app must be valid, containing only the expected keys and
      values." "App Store Connect rejects app submissions that include invalid privacy manifest files."
      Top-level keys: NSPrivacyTracking, NSPrivacyTrackingDomains, NSPrivacyCollectedDataTypes,
      NSPrivacyAccessedAPITypes (Privacy manifest files page).
    notes: The manifest has exactly the four top-level keys and parses with plistlib.

  - id: AR-PM-tracking-domains
    title: NSPrivacyTrackingDomains is listed only when NSPrivacyTracking is true
    area: privacy_manifest
    source: https://developer.apple.com/documentation/bundleresources/privacy-manifest-files
    checked: 2026-11-02
    applies_when: always
    check: static
    test: todo:02-static-compliance-checks
    status_now: met
    requirement: >
      NSPrivacyTracking: "When set to true you need to provide a list of internet domains in
      NSPrivacyTrackingDomains." "To provide a list of internet domains in NSPrivacyTrackingDomains, set
