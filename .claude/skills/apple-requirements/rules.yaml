# Apple requirements for WantWise: a sourced, dated rule catalogue.
#
# Every rule was read from the Apple page in `source` on the `checked` date. Nothing here comes from
# memory; where a fetched page was silent or ambiguous, the rule says so and `status_now` is `unknown`.
# Format, field meanings and how to refresh: SKILL.md next to this file. Lint: `python3 lint_rules.py`.
#
# This file uses a small YAML subset so the linter needs only the Python standard library:
# one top-level `rules:` list of flat mappings; values are plain or quoted scalars on one line,
# or a `>` folded block indented under the key. No anchors, flow collections or nested mappings.
#
# Pages fetched 2026-11-02 (attempt b607bb87). Documentation pages were read through Apple's
# documentation JSON (developer.apple.com/tutorials/data/documentation/<path>.json), which is the
# content behind the human URL given in `source`.

rules:

  # ---------------------------------------------------------------- App Review Guidelines: kids

  - id: AR-GL-1.3-kids-category
    title: Kids Category apps have no links out, purchases or distractions without a parental gate, and no third-party analytics or ads
    area: kids_category
    source: https://developer.apple.com/app-store/review/guidelines/#kids-category
    checked: 2026-11-02
    applies_when: kids_category
    check: review
    test: checklist:.claude/agents/app-store-reviewer.md
    status_now: not_applicable_yet
    requirement: >
      1.3: Kids Category apps "must not include links out of the app, purchasing opportunities, or
      other distractions to kids unless reserved for a designated area behind a parental gate" and
      "should not include third-party analytics or third-party advertising".
    notes: >
      WantWise is distributed by TestFlight only and is not listed in the Kids Category (D-031). Applies
      only if a public Kids Category listing is ever chosen.

  - id: AR-GL-5.1.4-kids-no-third-party-analytics
    title: An app intended primarily for kids has no third-party analytics or third-party advertising
    area: kids_category
    source: https://developer.apple.com/app-store/review/guidelines/#kids
    checked: 2026-11-02
    applies_when: always
    check: static
    test: todo:02-static-compliance-checks
    status_now: met
    requirement: >
      5.1.4(a): "Apps intended primarily for kids should not include third-party analytics or
      third-party advertising."
    notes: >
      The user is a child, so this applies regardless of category. project.yml has one package, the
      local WantWiseCore; no analytics, crash or ad SDK (grep, 2026-11-02).

  - id: AR-GL-5.1.4-kids-privacy-policy
    title: An app that collects or transmits personal information from a minor has a privacy policy and follows children's privacy law
    area: data_collection
    source: https://developer.apple.com/app-store/review/guidelines/#kids
    checked: 2026-11-02
    applies_when: data_leaves_device
    milestone: 3
    check: person
    test: checklist:docs/APP_STORE_COMPLIANCE.md#later-milestones
    status_now: not_applicable_yet
    requirement: >
      5.1.4(b): apps in the Kids Category "or those that collect, transmit, or have the capability to
      share personal information ... from a minor must include a privacy policy and must comply with
      all applicable children's privacy statutes."
    notes: >
      Milestone 3 (Supabase sync) sends the child's Wants to a server we control; this then applies in
      full (COPPA in the US, GDPR-K elsewhere). Today the only network use is the Milestone 2 link
      preview, which sends the shared URL and the device's IP address to the shared site. Our reading is
      that this is not "personal information from a minor" sent to us; a person should confirm that
      reading before the first upload.

  # ---------------------------------------------------------------- App Review Guidelines: 2.x

  - id: AR-GL-2.1-no-crash
    title: The submitted build is complete and doesn't crash or show obvious technical problems
    area: app_completeness
    source: https://developer.apple.com/app-store/review/guidelines/#app-completeness
    checked: 2026-11-02
    applies_when: always
    check: simulator
    test: apps/ios/WantWiseUITests/WantWiseUITests.swift
    status_now: met
    requirement: >
      2.1(a): "We will reject incomplete app bundles and binaries that crash or exhibit obvious
      technical problems."
    notes: >
      Milestone 1 loop and UI tests passed in the Simulator (Xcode 26.3, docs/VERIFICATION.md). Re-run
      on the exact build that is uploaded.

  - id: AR-GL-2.1-no-placeholder-content
    title: No placeholder text, empty websites or other temporary content in the submitted build
    area: app_completeness
    source: https://developer.apple.com/app-store/review/guidelines/#app-completeness
    checked: 2026-11-02
    applies_when: always
    check: static
    test: todo:02-static-compliance-checks
    status_now: met
    requirement: >
      2.1(a): "placeholder text, empty websites, and other temporary content should be scrubbed before
      submission".
    notes: >
      grep of string literals in WantWise/, WantWiseShare/ and Shared/ for TODO, FIXME, Lorem and
      placeholder found none (2026-11-02). DEBUG-only sample data is excluded from Release (D-027).

  - id: AR-GL-2.1-demo-account
    title: If the app has a login, give App Review a working demo account and keep the back end on
    area: app_completeness
    source: https://developer.apple.com/app-store/review/guidelines/#app-completeness
    checked: 2026-11-02
    applies_when: account_signin
    milestone: 3
    check: person
    test: checklist:docs/APPLE_HANDOFF.md#testflight-and-testers
    status_now: not_applicable_yet
    requirement: >
      2.1(a): "include demo account info (and turn on your back-end service!) if your app includes a
      login". App Store Connect's App Review information says the demo account "must not expire".
    notes: >
      Milestone 3 parent sign-in (D-017). Also stated at
      https://developer.apple.com/help/app-store-connect/reference/app-review-information (fetched
      2026-11-02).

  - id: AR-GL-2.2-testflight-intended-for-public
    title: A TestFlight beta should be intended for public distribution and follow the App Review Guidelines
    area: testflight
    source: https://developer.apple.com/app-store/review/guidelines/#beta-testing
    checked: 2026-11-02
    applies_when: release
    check: person
    test: checklist:docs/APP_STORE_COMPLIANCE.md#every-build-testflight
    status_now: not_met
    requirement: >
      2.2: "Any app submitted for beta distribution via TestFlight should be intended for public
      distribution and should comply with the App Review Guidelines." TestFlight builds can't be
      distributed for compensation.
    notes: >
      Conflicts with the current plan: TestFlight for one family with no public listing planned (D-014,
      D-031). Recorded as an open note in docs/DECISIONS.md (D-033); the decision itself is unchanged.
      Guideline wording is "should", so this is a review risk, not a stated upload block.

  - id: AR-GL-2.2-significant-updates-reviewed
