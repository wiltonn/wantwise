    checked: 2026-11-02
    applies_when: release
    check: person
    test: checklist:docs/APPLE_HANDOFF.md#testflight-and-testers
    status_now: not_applicable_yet
    requirement: >
      2.2: "Significant updates to your beta build should be submitted to TestFlight App Review before
      being distributed to your testers."
    notes: No build has been uploaded yet (Stage 3).

  - id: AR-GL-2.3.1-review-notes
