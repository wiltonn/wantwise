schema: openrig.mission/v0alpha1
kind: mission
# The project proof rollup counts only missions whose status is active or
# release-candidate. A new mission is planned, so it stays outside the rollup
# until you change this to active (or release-candidate).
metadata:
  name: "m0"
  status: planned
composition:
  mission_markdown:
    spec: SPEC.md
  slices:
    - ref: slices/01-apple-requirements-skill/slice.yaml
      order: 10
      active: true
    - ref: slices/02-static-compliance-checks/slice.yaml
      order: 20
      active: true
    - ref: slices/03-simulator-compliance-checks/slice.yaml
      order: 30
      active: true

# Optional team and SDLC sections are added here.
